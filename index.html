  <style>
    /* 기본 리셋 및 폰트 설정 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: #f4f6f8;
      margin: 0;

    /* 스마트폰 화면(최대 480px) 모바일 최적화 컨테이너 */
    .container {
      width: 100%;

      min-height: 100vh;
      background-color: #ffffff;
      padding: 40px 20px 40px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* 프로필 이미지(로고) 영역 - 파란색 배경 */
    .profile-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #005eb8;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      margin: 0 auto 20px;
      line-height: 1.3;
      text-align: center;
      padding: 5px;
      box-sizing: border-box;
    }

    /* 제목 및 소개글 */
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin: 0 0 8px 0;
    }
    .description {
      font-size: 15px;
      color: #666;
      margin: 0 0 30px 0;
      line-height: 1.5;
    }

    /* 섹션 구분 타이틀 */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #999;
      text-align: left;
      margin: 25px 0 15px 5px;
      letter-spacing: -0.5px;
    }

    /* === 공식 채널 아이콘 한 줄 배치 === */
    .channel-row {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      max-width: 320px;
      margin: 0 auto 30px auto;
    }
    .channel-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      gap: 8px;
      width: 80px;
    }
    .circle-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: transform 0.2s ease;
    }
    .channel-item:hover .circle-btn, 
    .channel-item:active .circle-btn {
      transform: scale(0.95);
    }
    
    /* 각 아이콘 개별 스타일 */
    .circle-btn.youtube {
      background-color: #ff0000;
    }
    .circle-btn.instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .circle-btn.chanyang {
      background-color: #005eb8;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
    }
    
    /* 아이콘 밑 텍스트 */
    .channel-text {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      white-space: nowrap;
    }

    /* 링크 버튼 스타일 (유튜브 영상용) */
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    /* 유튜브 전용 버튼 스타일 */
    .youtube-btn {
      background-color: #fff0f0;
      border: 1px solid #ffd6d6;
      color: #d32f2f;
    }
    .youtube-btn:active, .youtube-btn:hover {
      background-color: #d32f2f;
      color: #ffffff;
      border-color: #d32f2f;
    }

    /* 하단 계좌 안내 박스 (전체 글씨 두껍게 적용) */
    .account-box {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      text-align: center;
      font-size: 15px;
